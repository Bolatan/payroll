<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Payroll & Extended HR Suite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231d6b52%27/%3E%3Cpath d=%27M9 22V10h7a4 4 0 010 8h-7%27 stroke=%27white%27 stroke-width=%273%27 fill=%27none%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf0f3;--surface:#fff;--ink:#16202a;--muted:#5b6773;--line:#cfd6dd;--accent:#1d6b52;--accent-ink:#fff;--danger:#b3261e;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#10161c;--surface:#18212a;--ink:#e6ebf0;--muted:#97a3af;--line:#2c3945;--accent:#4fb38f;--accent-ink:#0b1712;--danger:#ff8a80;--warn:#e6b450}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums;text-align:right}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.4rem .8rem;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.4rem .6rem;width:100%}
#login{max-width:360px;margin:12vh auto;padding:1.5rem;background:var(--surface);border:1px solid var(--line);border-radius:10px}
#login h1{margin:0 0 .25rem;font-size:1.4rem}
#app{display:none;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--ink);color:var(--bg);padding:1.2rem .8rem;display:flex;flex-direction:column;gap:.2rem;overflow-y:auto}
@media (prefers-color-scheme:dark){nav{background:#0b1015}}
nav strong{font-size:1.05rem;padding:0 .6rem 1rem}
nav button{background:none;border:0;color:inherit;text-align:left;border-radius:6px;opacity:.8;padding:.4rem .6rem}
nav button[aria-current=true]{background:rgba(255,255,255,.14);opacity:1;font-weight:500}
nav .who{margin-top:auto;font-size:.85rem;opacity:.75;padding:.6rem}
main{padding:1.5rem;min-width:0}
h2{margin:0 0 1rem;font-size:1.3rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
form{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem;align-items:end}
label{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:.4rem}label.check input{width:auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:.45rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{font-weight:600;color:var(--muted)}
td.num,th.num{text-align:right}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem}.bar label{width:150px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-bottom:1rem}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem}
.stats b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}.stats span{color:var(--muted);font-size:.85rem}
.msg{padding:.6rem .8rem;border-radius:6px;margin-bottom:1rem;border:1px solid var(--line);background:var(--surface)}
.msg.err{border-color:var(--danger);color:var(--danger)}.msg.warn{border-color:var(--warn);color:var(--warn)}
.flag{color:var(--danger);font-weight:500}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);max-width:520px;width:92%}
dialog table td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.draft-watermark{position:relative}
.draft-watermark::before{content:"DRAFT";position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);font-size:5rem;font-weight:900;color:rgba(180,0,0,0.12);pointer-events:none;z-index:10;letter-spacing:10px}
tr.subtotal{background:rgba(0,0,0,0.04);font-weight:600}
tr.grandtotal{background:rgba(29,107,82,0.12);font-weight:bold;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent)}
@media (max-width:860px){#app{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;padding:.6rem}nav strong,nav .who{display:none}}
@media print{nav,.noprint{display:none!important}#app{display:block}dialog{border:0}}
</style>
</head>
<body>
<section id="login">
  <h1>Factory Payroll Suite</h1>
  <p style="color:var(--muted);margin-top:0">Sign in with your credentials.</p>
  <form id="loginForm" style="grid-template-columns:1fr">
    <label>Username<input id="user" autocomplete="username" required></label>
    <label>Password<input id="key" type="password" autocomplete="current-password" required></label>
    <button class="primary">Sign in</button>
  </form>
  <p id="loginErr" class="flag" role="alert"></p>
</section>

<div id="app">
  <nav id="nav"></nav>
  <main><div id="msg" role="status"></div><div id="view"></div></main>
</div>
<dialog id="slip"></dialog>

<script>
const $ = (s) => document.querySelector(s);
const money = (n) => (n ?? 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let me = null, tab = 'Payroll', empListCache = [];

async function getEmployeesList() {
  if (empListCache.length) return empListCache;
  try {
    const list = await api('/api/employees');
    if (Array.isArray(list)) {
      empListCache = list.sort((a, b) => (a.empId || '').localeCompare(b.empId || ''));
    }
  } catch (e) {
    empListCache = [];
  }
  return empListCache;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (sessionStorage.getItem('token') || '') }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (opts.raw) { if (!res.ok) throw new Error((await res.json()).error); return res; }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/api/auth/login') { sessionStorage.clear(); location.reload(); }
  if (data.code === 'PASSWORD_CHANGE_REQUIRED' && me) { me.mustChangePassword = true; tab = 'Account'; show(); }
  if (!res.ok) { const e = new Error(data.error || 'Request failed'); e.data = data; throw e; }
  return data;
}
function say(text, kind = '') { $('#msg').innerHTML = text ? `<div class="msg ${kind}">${text}</div>` : ''; }

// ---- screen definitions ----
const shifts = ['Day', 'Night', 'Weekend', 'Holiday'];
const countries = ['NG', 'GH', 'KE'];
const currencies = ['NGN', 'GHS', 'KES', 'USD'];
const empStatuses = ['Active', 'On Leave', 'Suspended', 'Terminated'];
const empTypes = ['Permanent', 'Contract', 'Casual'];
const payFreqs = ['Monthly', 'Weekly', 'Bi-Weekly'];

const SCREENS = {
  Employees: { path: '/api/employees', roles: ['hr', 'payroll', 'approver', 'auditor', 'executive'], write: ['hr'], key: 'empId',
    fields: [['empId', 'Employee ID (leave blank to auto-generate)'], ['surname', 'Surname'], ['firstName', 'First name'], ['department', 'Department'], ['position', 'Position'],
      ['employmentType', 'Employment Type', 'select', empTypes], ['payFrequency', 'Pay Frequency', 'select', payFreqs],
      ['hireDate', 'Hire Date', 'date'], ['country', 'Country', 'select', countries], ['currency', 'Currency', 'select', currencies],
      ['basic', 'Basic (monthly)', 'number'], ['hourlyRate', 'Hourly Rate (optional)', 'number'], ['hourlyRateOverrideReason', 'Hourly Rate Override Reason'],
      ['housing', 'Housing', 'number'], ['transport', 'Transport', 'number'], ['otherAllowance', 'Other allowance', 'number'],
      ['annualRent', 'Annual rent paid', 'number'], ['rentEvidenceRef', 'Rent Evidence Ref'],
      ['bank', 'Bank Name'], ['accountNo', 'Account No (10-digit NUBAN)'],
      ['state', 'State of residence'], ['tin', 'Tax ID (TIN)'], ['pensionPin', 'Pension PIN'], ['pfa', 'PFA Name'], ['nhfNumber', 'NHF Number'],
      ['pensionPct', 'Pension % (default 0.08)', 'number'], ['nhfPct', 'NHF % (default 0.025)', 'number'], ['nhfEnrolled', 'Enrolled in NHF', 'check'],
      ['dob', 'Date of Birth', 'date'], ['phone', 'Phone Number'], ['email', 'Email Address'], ['emergencyContact', 'Emergency Contact'],
      ['status', 'Status', 'select', empStatuses]],
    cols: ['empId', 'surname', 'firstName', 'department', 'position', 'employmentType', 'basic', 'hourlyRate', 'bank', 'accountNo', 'status'] },
  Attendance: { path: '/api/attendance', roles: ['payroll', 'approver', 'hr', 'supervisor', 'auditor'], write: ['payroll', 'supervisor'], approve: ['approver', 'supervisor'],
    fields: [['empId', 'Employee ID'], ['date', 'Date', 'date'], ['shift', 'Shift', 'select', shifts], ['clockIn', 'Clock in', 'time'], ['clockOut', 'Clock out', 'time'], ['breakHours', 'Unpaid break (hours)', 'number'], ['absent', 'Mark Absent', 'check']],
    cols: ['empId', 'date', 'shift', 'clockIn', 'clockOut', 'hoursWorked', 'otHours', 'weekendOT', 'holidayOT', 'multiplier', 'absent', 'lateMinutes', 'approved'] },
  Loans: { path: '/api/loans', roles: ['payroll', 'approver', 'hr', 'auditor'], write: ['payroll', 'hr'], approve: ['approver'],
    fields: [['loanId', 'Loan ID (Optional)'], ['empId', 'Employee ID'], ['amount', 'Loan amount', 'number'], ['termMonths', 'Term (months)', 'number'], ['startPeriod', 'First deduction period', 'month'], ['interestRate', 'Interest Rate (e.g. 0.05)', 'number']],
    cols: ['loanId', 'empId', 'amount', 'termMonths', 'monthly', 'outstanding', 'startPeriod', 'status'], pending: (r) => r.status === 'Pending' },
  'Loan Repayments': { path: '/api/loans-ledger', roles: ['payroll', 'approver', 'hr', 'auditor'], readOnly: true,
    cols: ['loanId', 'empId', 'period', 'amountDeducted', 'balanceBefore', 'balanceAfter', 'type', 'approvedBy'] },
  'Bonus Register': { path: '/api/bonuses', roles: ['payroll', 'approver', 'hr', 'auditor'], write: ['payroll', 'hr'], approve: ['approver'],
    fields: [['period', 'Period', 'month'], ['empId', 'Employee ID'], ['performanceBonus', 'Performance Bonus', 'number'], ['productionBonus', 'Production Bonus', 'number'], ['attendanceBonus', 'Attendance Bonus', 'number'], ['otherBonus', 'Other Bonus', 'number'], ['otherBonusDescription', 'Other Bonus Description'], ['comments', 'Comments']],
    cols: ['period', 'empId', 'performanceBonus', 'productionBonus', 'attendanceBonus', 'otherBonus', 'totalBonuses', 'status'], pending: (r) => r.status === 'Pending' },
  Allowances: { path: '/api/allowances', roles: ['payroll', 'approver', 'hr', 'auditor'], write: ['payroll', 'hr'], approve: ['approver'],
    fields: [['empId', 'Employee ID'], ['type', 'Type', 'select', ['shift_allowance', 'hazard', 'meal', 'other']], ['title', 'Title / Description'], ['amount', 'Amount', 'number'], ['recurring', 'Recurring', 'check'], ['startPeriod', 'Start Period', 'month'], ['endPeriod', 'End Period', 'month'], ['taxable', 'Taxable', 'check'], ['pensionable', 'Pensionable', 'check'], ['reason', 'Reason']],
    cols: ['empId', 'type', 'title', 'amount', 'recurring', 'startPeriod', 'taxable', 'pensionable', 'status'], pending: (r) => r.status === 'Pending' },
  'Deductions Register': { path: '/api/deductions', roles: ['payroll', 'approver', 'hr', 'auditor'], write: ['payroll', 'hr'], approve: ['approver'],
    fields: [['empId', 'Employee ID'], ['type', 'Type', 'select', ['cooperative', 'union_dues', 'damages', 'salary_advance', 'other']], ['title', 'Title / Description'], ['amount', 'Amount', 'number'], ['recurring', 'Recurring', 'check'], ['startPeriod', 'Start Period', 'month'], ['endPeriod', 'End Period', 'month'], ['reason', 'Reason']],
    cols: ['empId', 'type', 'title', 'amount', 'recurring', 'startPeriod', 'endPeriod', 'status'], pending: (r) => r.status === 'Pending' },
  Adjustments: { path: '/api/adjustments', roles: ['payroll', 'approver', 'hr', 'auditor'], write: ['payroll', 'hr'], approve: ['approver'],
    fields: [['period', 'Period', 'month'], ['empId', 'Employee ID'], ['type', 'Type', 'select', ['bonus', 'earning', 'deduction']], ['subtype', 'Category', 'select', ['general', 'arrears', 'back_pay', 'bonus', 'absence', 'damage', 'advance', 'other']], ['priorPeriod', 'Prior Period (for arrears/back-pay)', 'month'], ['amount', 'Amount', 'number'], ['reason', 'Reason (Mandatory)']],
    cols: ['period', 'empId', 'type', 'subtype', 'priorPeriod', 'amount', 'reason', 'approved'] },
  Recruitment: { path: '/api/recruitment', roles: ['hr', 'approver'], write: ['hr'],
    fields: [['fullName', 'Full Name'], ['email', 'Email'], ['phone', 'Phone'], ['position', 'Position'], ['department', 'Department'], ['offeredSalary', 'Offered Salary', 'number']],
    cols: ['candidateId', 'fullName', 'position', 'department', 'offeredSalary', 'stage'] },
  Appraisals: { path: '/api/appraisals', roles: ['hr', 'approver', 'payroll'], write: ['hr', 'approver'], approve: ['approver'],
    fields: [['empId', 'Employee ID'], ['cycle', 'Cycle (e.g. 2026-H1)'], ['rating', 'Rating (1-5)', 'number'], ['feedback', 'Feedback'], ['bonusRecommendation', 'Recommended Bonus', 'number']],
    cols: ['empId', 'cycle', 'rating', 'bonusRecommendation', 'status', 'reviewer'], pending: (r) => r.status === 'Draft' },
  Leaves: { path: '/api/leaves', roles: ['hr', 'approver', 'employee'], write: ['hr', 'employee'], approve: ['approver', 'hr'],
    fields: [['empId', 'Employee ID'], ['leaveType', 'Leave Type', 'select', ['Annual', 'Sick', 'Maternity', 'Paternity', 'Compassionate', 'Study', 'Unpaid']], ['startDate', 'Start Date', 'date'], ['endDate', 'End Date', 'date'], ['reason', 'Reason'], ['overrideReason', 'Override Reason (if balance exceeded)']],
    cols: ['empId', 'leaveType', 'startDate', 'endDate', 'days', 'status', 'isOverridden', 'approvedBy'], pending: (r) => r.status === 'Pending' },
  'Leave Balances': { path: '/api/leaves/balances', roles: ['hr', 'approver', 'admin', 'employee'], write: ['hr', 'admin'],
    fields: [['empId', 'Employee ID'], ['year', 'Year', 'number'], ['leaveType', 'Leave Type', 'select', ['Annual', 'Sick', 'Maternity', 'Paternity', 'Compassionate', 'Study', 'Unpaid']], ['entitlement', 'Entitlement (Days)', 'number'], ['carryOver', 'Carry Over (Days)', 'number']],
    cols: ['empId', 'year', 'leaveType', 'entitlement', 'used', 'pending', 'carryOver'] },
  'General Ledger': { path: '/api/gl/journals', roles: ['payroll', 'approver', 'admin'], readOnly: true,
    cols: ['journalNumber', 'period', 'postDate', 'totalDebit', 'totalCredit', 'status', 'postedBy'] },
  'Bank Payments': { path: '/api/payments/batches', roles: ['payroll', 'approver'], readOnly: true,
    cols: ['batchReference', 'period', 'channel', 'totalAmount', 'successfulCount', 'failedCount', 'status'] },
  'Time-Clock': { path: '/api/timeclock/punches', roles: ['payroll', 'approver', 'admin'],
    cols: ['deviceId', 'empId', 'timestamp', 'punchType', 'verificationType', 'processed'] },
  'Shift Setup': { path: '/api/shifts/setup', roles: ['admin', 'hr', 'payroll', 'approver'], write: ['admin', 'hr'],
    fields: [['shift', 'Shift Name (e.g. Day, Night, Weekend, Holiday, Custom)'], ['stdHours', 'Standard Hours (1-24)', 'number'], ['multiplier', 'OT Multiplier (>= 1.0)', 'number'], ['startTime', 'Start Time (HH:MM)'], ['endTime', 'End Time (HH:MM)'], ['unpaidBreakHours', 'Unpaid Break Hours', 'number'], ['effectiveDate', 'Effective Date', 'date'], ['reason', 'Reason for change']],
    cols: ['shift', 'stdHours', 'multiplier', 'startTime', 'endTime', 'unpaidBreakHours', 'effectiveDate'] },
  'Public Holidays': { path: '/api/holidays', roles: ['admin', 'hr', 'payroll', 'approver'], write: ['admin', 'hr'],
    fields: [['date', 'Holiday Date', 'date'], ['name', 'Holiday Name']],
    cols: ['date', 'name'] },
  Audit: { path: '/api/audit', roles: ['approver', 'auditor', 'admin'], readOnly: true, cols: ['ts', 'user', 'action', 'entity', 'entityId'] },
};

const can = (list) => me.role === 'admin' || list.includes(me.role);

function renderNav() {
  let items = [];
  if (me.mustChangePassword) {
    items = ['Account'];
  } else if (me.role === 'employee') {
    items = ['Self-Service', 'My Payslips', 'Leaves', 'Account'];
  } else {
    items = [
      ...(can(['payroll', 'approver', 'hr', 'executive', 'auditor']) ? ['Payroll'] : []),
      ...(me.empId ? ['My Payslips'] : []),
      ...(can(['executive', 'approver']) ? ['Executive'] : []),
      ...(can(['tax_advisor', 'approver', 'payroll', 'executive']) ? ['Remittances'] : []),
      ...Object.keys(SCREENS).filter((k) => can(SCREENS[k].roles)),
      ...(me.role === 'admin' ? ['Users'] : []),
      'Account'
    ];
  }
  const uniqueItems = [...new Set(items)];
  $('#nav').innerHTML = `<strong>Factory Payroll Suite</strong>` + uniqueItems.map((t) => `<button data-t="${t}" ${t === tab ? 'aria-current="true"' : ''}>${t}</button>`).join('') +
    `<div class="who">${esc(me.name)} (${me.role})<br><button id="out" style="margin-top:.4rem">Sign out</button></div>`;
  $('#nav').onclick = (e) => { if (e.target.dataset.t) { tab = e.target.dataset.t; say(''); show(); } };
  $('#out').onclick = () => { sessionStorage.clear(); location.reload(); };
}

function showPayslipModal(p) {
  const row = (l, v, b) => `<tr><td>${b ? '<b>' + l + '</b>' : l}</td><td>${b ? '<b>' + money(v) + '</b>' : money(v)}</td></tr>`;
  $('#slip').innerHTML = `<h3 style="margin-top:0">Payslip, ${esc(p.period)}</h3><p>${esc(p.name)} (${esc(p.empId)})<br>${esc(p.department || '')} ${esc(p.position || '')}${p.status !== 'Approved' ? '<br><b class="flag">Draft, not approved</b>' : ''}</p>
  <table>${row('Basic', p.basic)}${row('Allowances', p.allowances)}${row(`Overtime (${p.otHours || 0} h)`, p.otPay)}${row('Bonuses', p.bonuses)}${row('Gross pay', p.gross, 1)}${row('Pension', p.pension)}${row('NHF', p.nhf)}${row('PAYE', p.paye)}${row('Loan deduction', p.loanDeduction)}${row('Other deductions', p.otherDeductions)}${row('Net pay', p.netPay, 1)}</table>
  <p class="noprint" style="display:flex;gap:.5rem;margin-top:1rem"><button class="primary" onclick="window.print()">Print</button><button onclick="document.querySelector('#slip').close()">Close</button></p>`;
  $('#slip').showModal();
}

async function show() {
  renderNav();
  if (tab === 'Account') return accountView();
  if (tab === 'Users') return usersView();
  if (tab === 'Payroll') return payrollView();
  if (tab === 'Self-Service') return essView();
  if (tab === 'My Payslips') return myPayslipsView();
  if (tab === 'Executive') return executiveView();
  if (tab === 'Remittances') return remittancesView();
  const s = SCREENS[tab];
  let rows = [];
  try {
    const res = await api(s.path);
    rows = Array.isArray(res) ? res : [];
  } catch (e) { return say(esc(e.message), 'err'); }

  let extraActions = '';
  if (tab === 'Time-Clock' && can(['payroll'])) {
    extraActions = `<div class="bar noprint"><button id="processPunches" class="primary">Pair & Process Punches to Attendance</button></div>`;
  } else if (tab === 'Employees') {
    extraActions = `<div class="bar noprint">
      <button id="exportEmps">Export Employees CSV</button>
      ${can(['hr']) ? '<button id="importEmpsBtn">Bulk Import CSV / JSON</button>' : ''}
    </div>
    <div id="importArea" class="card" style="display:none">
      <h3>Bulk Import Employees</h3>
      <p style="color:var(--muted);font-size:.85rem">Paste a JSON array of employee objects or JSON rows to import with row-level validation.</p>
      <textarea id="importPayload" rows="6" placeholder='[{"surname":"Doe","firstName":"Jane","basic":180000,"bank":"Access Bank","accountNo":"0123456789"}]'></textarea>
      <div style="margin-top:.6rem"><button id="doImport" class="primary">Execute Import</button> <button id="cancelImport">Cancel</button></div>
      <div id="importResult" style="margin-top:.6rem"></div>
    </div>`;
  } else if (tab === 'Attendance') {
    extraActions = `<div class="bar noprint">
      ${can(['payroll']) ? '<button id="bulkImportAttBtn">Bulk Import Attendance</button>' : ''}
      ${can(['payroll', 'approver']) ? '<button id="autoAbsentBtn">Trigger Auto-Absent Check</button>' : ''}
      <button id="viewExceptionsBtn">View Overtime Exceptions</button>
    </div>
    <div id="attImportArea" class="card" style="display:none">
      <h3>Bulk Import Attendance</h3>
      <p style="color:var(--muted);font-size:.85rem">Paste a JSON array of attendance entries (Date, EmpID, Shift, ClockIn, ClockOut, etc.).</p>
      <textarea id="attImportPayload" rows="6" placeholder='[{"empId":"EMP0001","date":"2026-11-02","shift":"Day","clockIn":"08:00","clockOut":"17:00","breakHours":1}]'></textarea>
      <div style="margin-top:.6rem"><button id="doAttImport" class="primary">Execute Import</button> <button id="cancelAttImport">Cancel</button></div>
      <div id="attImportResult" style="margin-top:.6rem"></div>
    </div>`;
  }

  let empOptionsHtml = '';
  if (Array.isArray(s.fields) && s.fields.some(([k]) => k === 'empId') && tab !== 'Employees') {
    const emps = await getEmployeesList();
    empOptionsHtml = `<option value="">Select Employee...</option>` + (Array.isArray(emps) ? emps : []).map((e) =>
      `<option value="${esc(e.empId)}">${esc(e.empId)} - ${esc(e.surname)} ${esc(e.firstName)} (${esc(e.department || 'General')})</option>`
    ).join('');
  }

  const form = !s.readOnly && can(s.write) && Array.isArray(s.fields) ? `<form class="card" id="f"><h3 style="grid-column:1/-1;margin:0">Add ${tab.toLowerCase().replace(/s$/, '')}</h3>` + s.fields.map(([k, label, type = 'text', opts]) => {
    if (k === 'empId' && tab !== 'Employees') {
      return `<label>${label}<select name="empId" required>${empOptionsHtml}</select></label>`;
    }
    return type === 'select' ? `<label>${label}<select name="${k}">${(opts || []).map((o) => `<option>${o}</option>`).join('')}</select></label>`
      : type === 'check' ? `<label class="check"><input type="checkbox" name="${k}" checked>${label}</label>`
      : `<label>${label}<input name="${k}" type="${type}" ${type === 'number' ? 'step="any" min="0"' : ''}></label>`;
  }).join('') + `<button class="primary">Save</button></form>` : '';
  const canApprove = s.approve && can(s.approve);
  const isRecruitment = tab === 'Recruitment' && can(['hr']);
  const isEmployees = tab === 'Employees';

  $('#view').innerHTML = `<h2>${tab}</h2>${extraActions}${form}<div class="card scroll">${rows.length ? `<table><thead><tr>${s.cols.map((c) => `<th>${c}</th>`).join('')}${(canApprove || isRecruitment || isEmployees) ? '<th>Action</th>' : ''}</tr></thead><tbody>` +
    rows.map((r) => `<tr>${s.cols.map((c) => `<td class="${typeof r[c] === 'number' ? 'num' : ''}">${fmt(c, r[c])}</td>`).join('')}${(canApprove || isRecruitment || isEmployees) ? `<td>` +
      ((canApprove && (s.pending ? s.pending(r) : r.approved === false)) ? `<button data-id="${r._id}">Approve</button> <button data-reject="${r._id}">Reject</button> ` : '') +
      ((isRecruitment && r.stage !== 'Hired') ? `<button data-hire="${r._id}">Hire & Onboard</button> ` : '') +
      ((isEmployees && can(['hr']) && r.status !== 'Terminated') ? `<button data-deact="${r.empId}">Deactivate</button>` : '') +
      `</td>` : ''}</tr>`).join('') + `</tbody></table>` : `<p style="color:var(--muted)">Nothing here yet.${form ? ' Use the form above to add the first record.' : ''}</p>`}</div>`;

  if ($('#processPunches')) {
    $('#processPunches').onclick = async () => {
      try { const res = await api('/api/timeclock/process-punches', { method: 'POST' }); say(res.message); show(); }
      catch (e) { say(esc(e.message), 'err'); }
    };
  }

  if (form) $('#f').onsubmit = async (e) => {
    e.preventDefault();
    const body = {};
    s.fields.forEach(([k, , type]) => { const el = e.target.elements[k]; body[k] = type === 'check' ? el.checked : type === 'number' ? (el.value === '' ? undefined : Number(el.value)) : el.value; });
    try { await api(s.path, { method: 'POST', body }); say('Saved.'); show(); } catch (err) { say(esc(err.message), 'err'); }
  };

  if ($('#exportEmps')) {
    $('#exportEmps').onclick = async () => {
      try {
        const r = await api('/api/employees/export', { raw: true });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(await r.blob());
        a.download = `employees-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
      } catch (err) { say(esc(err.message), 'err'); }
    };
  }

  if ($('#bulkImportAttBtn')) {
    $('#bulkImportAttBtn').onclick = () => {
      const el = $('#attImportArea');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    };
    $('#cancelAttImport').onclick = () => { $('#attImportArea').style.display = 'none'; };
    $('#doAttImport').onclick = async () => {
      const raw = $('#attImportPayload').value.trim();
      if (!raw) return say('Please paste JSON attendance entries.', 'warn');
      try {
        const data = JSON.parse(raw);
        const res = await api('/api/attendance/bulk-import', { method: 'POST', body: data });
        say(`Attendance import complete: ${res.imported} succeeded, ${res.failed} failed.`);
        $('#attImportResult').innerHTML = `<p><b>Total:</b> ${res.total} | <b>Imported:</b> ${res.imported} | <b>Failed:</b> ${res.failed}</p>` +
          (res.report.length ? `<ul>${res.report.map((r) => `<li>Row ${r.row} (${esc(r.empId)}): ${esc(r.status)} ${r.errors ? '- ' + esc(r.errors.join(', ')) : ''}</li>`).join('')}</ul>` : '');
        setTimeout(show, 2000);
      } catch (err) { say(esc(err.message), 'err'); }
    };
  }

  if ($('#autoAbsentBtn')) {
    $('#autoAbsentBtn').onclick = async () => {
      const dateStr = prompt('Enter date to check auto-absence (YYYY-MM-DD):', new Date().toISOString().slice(0, 10));
      if (!dateStr) return;
      try {
        const res = await api('/api/attendance/auto-absent', { method: 'POST', body: { date: dateStr } });
        say(res.message);
        show();
      } catch (err) { say(esc(err.message), 'err'); }
    };
  }

  if ($('#viewExceptionsBtn')) {
    $('#viewExceptionsBtn').onclick = async () => {
      try {
        const ex = await api('/api/attendance/exceptions');
        alert(`Attendance Exceptions:\nUnapproved Overtime: ${ex.totalUnapprovedOT} records\nOvertime Cap Exceeded: ${ex.totalCapExceeded} records`);
      } catch (err) { say(esc(err.message), 'err'); }
    };
  }

  if ($('#importEmpsBtn')) {
    $('#importEmpsBtn').onclick = () => {
      const el = $('#importArea');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    };
    $('#cancelImport').onclick = () => { $('#importArea').style.display = 'none'; };
    $('#doImport').onclick = async () => {
      const raw = $('#importPayload').value.trim();
      if (!raw) return say('Please paste JSON records to import.', 'warn');
      try {
        const data = JSON.parse(raw);
        const res = await api('/api/employees/bulk-import', { method: 'POST', body: data });
        say(`Import complete: ${res.imported} succeeded, ${res.failed} failed.`);
        $('#importResult').innerHTML = `<p><b>Total:</b> ${res.total} | <b>Imported:</b> ${res.imported} | <b>Failed:</b> ${res.failed}</p>` +
          (res.report.length ? `<ul>${res.report.map((r) => `<li>Row ${r.row} (${esc(r.empId)}): ${esc(r.status)} ${r.errors ? '- ' + esc(r.errors.join(', ')) : ''}</li>`).join('')}</ul>` : '');
        setTimeout(show, 2000);
      } catch (err) { say(esc(err.message), 'err'); }
    };
  }

  if (canApprove || isRecruitment || isEmployees) $('#view').onclick = async (e) => {
    if (e.target.dataset.id) {
      try { await api(`${s.path}/${e.target.dataset.id}/approve`, { method: 'POST' }); say('Approved.'); show(); } catch (err) { say(esc(err.message), 'err'); }
    } else if (e.target.dataset.reject) {
      const reason = prompt('Enter rejection reason (optional):') || undefined;
      try { await api(`${s.path}/${e.target.dataset.reject}/reject`, { method: 'POST', body: { reason } }); say('Rejected.'); show(); } catch (err) { say(esc(err.message), 'err'); }
    } else if (e.target.dataset.hire) {
      try { await api(`/api/recruitment/${e.target.dataset.hire}/hire`, { method: 'POST', body: {} }); say('Candidate hired and added to Employee master.'); show(); }
      catch (err) { say(esc(err.message), 'err'); }
    } else if (e.target.dataset.deact) {
      if (!confirm(`Are you sure you want to deactivate and terminate employee ${e.target.dataset.deact}?`)) return;
      try {
        await api(`/api/employees/${e.target.dataset.deact}/deactivate`, { method: 'POST', body: {} });
        say('Employee deactivated and marked Terminated.');
        show();
      } catch (err) { say(esc(err.message), 'err'); }
    }
  };
}

const fmt = (c, v) => v === true ? 'Yes' : v === false ? 'No' : v == null ? '' : /^(basic|amount|monthly|outstanding|offeredSalary|totalAmount|totalDebit|totalCredit)$/.test(c) ? money(v) : /^(date|ts|timestamp|postDate|startDate|endDate|effectiveDate)$/.test(c) ? new Date(v).toLocaleDateString('en-NG') : esc(v);

    try {
      if (d.toggle) { await api(`/api/users/${d.toggle}`, { method: 'PUT', body: { active: d.active !== 'true' } }); say('User updated.'); usersView(); }
      if (d.reset) { const pw = prompt('Enter a temporary password (10+ characters, with a letter and a number):'); if (!pw) return;
        await api(`/api/users/${d.reset}/reset-password`, { method: 'POST', body: { password: pw } }); say('Password reset. The user must choose a new one at next sign-in.'); }
    } catch (err) { say(esc(err.message), 'err'); }
  };
  $('#view').onchange = async (e) => {
    if (!e.target.dataset.role) return;
    try { await api(`/api/users/${e.target.dataset.role}`, { method: 'PUT', body: { role: e.target.value } }); say('Role updated. The user will be signed out.'); }
    catch (err) { say(esc(err.message), 'err'); usersView(); }
  };
}

// ---- payroll ----
async function payrollView(period = $('#period')?.value || new Date().toISOString().slice(0, 7)) {
  let run = null;
  let validation = null;
  try { run = await api(`/api/payroll/${period}`); } catch (e) { /* none yet */ }
  try { validation = await api(`/api/payroll/${period}/exceptions`); } catch (e) { /* none yet */ }
  const t = run?.totals;
  const isLocked = run && ['Approved', 'Paid/Locked'].includes(run.status);
  const statusDisplay = run?.status || 'Open (Not Run)';

  let reg = null;
  const deptFilter = $('#regDeptFilter')?.value || '';
  const searchFilter = $('#regSearch')?.value || '';
  const sortBy = $('#regSortBy')?.value || 'empId';
  const sortDir = $('#regSortDir')?.value || 'asc';

  if (run) {
    try {
      const qParams = new URLSearchParams();
      if (deptFilter) qParams.set('department', deptFilter);
      if (searchFilter) qParams.set('search', searchFilter);
      if (sortBy) qParams.set('sortBy', sortBy);
      if (sortDir) qParams.set('sortDir', sortDir);
      reg = await api(`/api/payroll/${period}/register?${qParams.toString()}`);
    } catch (e) { /* ignore */ }
  }

  const deptList = [...new Set((run?.lines || []).map((l) => l.department || 'General'))].sort();

  $('#view').innerHTML = `<h2>Payroll (${esc(period)})</h2>
  <div class="bar noprint"><label>Period<input id="period" type="month" value="${period}"></label>
    ${can(['payroll']) && !isLocked ? '<button id="prepInputs">Prepare Inputs</button>' : ''}
    ${can(['payroll']) && !isLocked ? '<button id="calc" class="primary">Calculate payroll</button>' : ''}
    ${can(['approver', 'executive']) && !isLocked ? '<button id="appr" class="primary">Approve and lock</button>' : ''}
    ${run ? '<button id="dlRegCsv">Export Register CSV</button>' : ''}
    ${run ? '<button id="dlRegXlsx">Export Register XLSX</button>' : ''}
    ${run ? '<button id="dlRegPdf">Export Register PDF</button>' : ''}
    ${run && isLocked && can(['payroll', 'approver']) ? '<button id="bank">Download bank file</button>' : ''}
    ${run && isLocked && can(['payroll', 'approver']) ? '<button id="postGL" class="primary">Post GL Journal</button>' : ''}
    ${run && isLocked && can(['payroll', 'approver']) ? '<button id="initiateBank">Direct Bank Transfer</button>' : ''}</div>
  <div class="msg ${isLocked ? '' : (run ? 'warn' : '')}">
    <b>State:</b> ${esc(statusDisplay)}${run?.preparedBy ? ` | Prepared by ${esc(run.preparedBy)}` : ''}${run?.approvedBy ? ` | Approved by ${esc(run.approvedBy)}` : ''}
    ${run?.versionStamp ? `<br><b>Version Stamp:</b> <code>${esc(run.versionStamp)}</code> (Approved: ${new Date(run.approvedAt).toLocaleString('en-NG')})` : ''}
    ${run?.glPosted ? `<br><b>GL Journal Posted:</b> ${esc(run.glJournalId)}` : ''}
    ${run?.bankPaymentInitiated ? `<br><b>Bank Payment Dispatched:</b> ${esc(run.paymentReference)}` : ''}
  </div>
  ${run?.warnings?.map((w) => `<div class="msg warn">${esc(w)}</div>`).join('') || ''}
  ${validation && validation.exceptions?.length ? `
    <div class="card" style="margin-bottom:1rem;border-left:4px solid var(--danger)">
      <h3 style="margin-top:0;color:var(--danger)">Pre-Calculation Exceptions (${validation.blockingCount} blocking)</h3>
      <ul style="margin:0;padding-left:1.2rem">
        ${validation.exceptions.map((x) => `<li><b class="${x.blocking ? 'flag' : ''}">[${esc(x.type)}]</b> ${esc(x.message)}</li>`).join('')}
      </ul>
    </div>
  ` : ''}
  ${run && t ? `
  <div class="stats">${[['Employees', t.employees], ['Gross pay', money(t.gross)], ['PAYE', money(t.paye)], ['Pension (employee)', money(t.pension)], ['Employer Pension', money(t.employerPension)], ['Net pay', money(t.net)]].map(([l, v]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>

  <div class="card ${reg?.watermark ? 'draft-watermark' : ''}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;flex-wrap:wrap;gap:0.5rem">
      <h3 style="margin:0">Payroll Register Output (FR-REG-01 to FR-REG-04)</h3>
      ${reg?.watermark ? `<span class="flag" style="font-size:1.1rem;font-weight:bold;border:2px dashed var(--danger);padding:0.2rem 0.6rem;border-radius:4px">WATERMARK: ${esc(reg.watermark)}</span>` : '<span style="color:var(--accent);font-weight:bold;border:2px solid var(--accent);padding:0.2rem 0.6rem;border-radius:4px">FINAL / APPROVED</span>'}
    </div>

    <div class="bar noprint" style="margin-bottom:0.8rem">
      <label>Department<select id="regDeptFilter"><option value="">All Departments</option>${deptList.map((d) => `<option value="${esc(d)}" ${d === deptFilter ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select></label>
      <label>Search<input id="regSearch" placeholder="EmpID, Name..." value="${esc(searchFilter)}"></label>
      <label>Sort By<select id="regSortBy">
        <option value="empId" ${sortBy === 'empId' ? 'selected' : ''}>EmpID</option>
        <option value="name" ${sortBy === 'name' ? 'selected' : ''}>Name</option>
        <option value="department" ${sortBy === 'department' ? 'selected' : ''}>Department</option>
        <option value="grossPay" ${sortBy === 'grossPay' ? 'selected' : ''}>Gross Pay</option>
        <option value="netPay" ${sortBy === 'netPay' ? 'selected' : ''}>Net Pay</option>
      </select></label>
      <label>Sort Order<select id="regSortDir">
        <option value="asc" ${sortDir === 'asc' ? 'selected' : ''}>Ascending</option>
        <option value="desc" ${sortDir === 'desc' ? 'selected' : ''}>Descending</option>
      </select></label>
      <button id="applyFilters">Apply</button>
      <button id="resetFilters">Reset</button>
    </div>

    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Period</th><th>EmpID</th><th>Name</th><th>Department</th>
            <th class="num">Basic</th><th class="num">OT Pay</th><th class="num">Allowances</th><th class="num">Bonuses</th>
            <th class="num">Gross Pay</th><th class="num">Pension</th><th class="num">NHF</th><th class="num">Taxable Pay</th>
            <th class="num">PAYE</th><th class="num">Loan Ded.</th><th class="num">Other Ded.</th><th class="num">Net Pay</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${(reg?.departmentSubtotals || []).map((sub) => {
            const dItems = (reg.items || []).filter((it) => it.department === sub.department);
            return dItems.map((l) => `<tr>
              <td>${esc(l.period)}</td><td><b>${esc(l.empId)}</b></td><td>${esc(l.name)}</td><td>${esc(l.department)}</td>
              <td class="num">${money(l.basic)}</td><td class="num">${money(l.otPay)}</td><td class="num">${money(l.allowances)}</td><td class="num">${money(l.bonuses)}</td>
              <td class="num"><b>${money(l.grossPay)}</b></td><td class="num">${money(l.pension)}</td><td class="num">${money(l.nhf)}</td><td class="num">${money(l.taxablePay)}</td>
              <td class="num">${money(l.paye)}</td><td class="num">${money(l.loanDeduction)}</td><td class="num">${money(l.otherDeductions)}</td><td class="num"><b>${money(l.netPay)}</b></td>
              <td><button data-slip="${esc(l.empId)}">Payslip</button></td>
            </tr>`).join('') +
            `<tr class="subtotal">
              <td colspan="4"><b>Subtotal (${esc(sub.department)}) - ${sub.count} employees</b></td>
              <td class="num">${money(sub.basic)}</td><td class="num">${money(sub.otPay)}</td><td class="num">${money(sub.allowances)}</td><td class="num">${money(sub.bonuses)}</td>
              <td class="num">${money(sub.grossPay)}</td><td class="num">${money(sub.pension)}</td><td class="num">${money(sub.nhf)}</td><td class="num">${money(sub.taxablePay)}</td>
              <td class="num">${money(sub.paye)}</td><td class="num">${money(sub.loanDeduction)}</td><td class="num">${money(sub.otherDeductions)}</td><td class="num">${money(sub.netPay)}</td>
              <td></td>
            </tr>`;
          }).join('')}
          ${reg?.grandTotal ? `<tr class="grandtotal">
            <td colspan="4"><b>GRAND TOTAL (${reg.grandTotal.count} employees)</b></td>
            <td class="num">${money(reg.grandTotal.basic)}</td><td class="num">${money(reg.grandTotal.otPay)}</td><td class="num">${money(reg.grandTotal.allowances)}</td><td class="num">${money(reg.grandTotal.bonuses)}</td>
            <td class="num"><b>${money(reg.grandTotal.grossPay)}</b></td><td class="num">${money(reg.grandTotal.pension)}</td><td class="num">${money(reg.grandTotal.nhf)}</td><td class="num">${money(reg.grandTotal.taxablePay)}</td>
            <td class="num">${money(reg.grandTotal.paye)}</td><td class="num">${money(reg.grandTotal.loanDeduction)}</td><td class="num">${money(reg.grandTotal.otherDeductions)}</td><td class="num"><b>${money(reg.grandTotal.netPay)}</b></td>
            <td></td>
          </tr>` : ''}
        </tbody>
      </table>
    </div>
  </div>`
    : `<p style="color:var(--muted)">No payroll calculated for ${period} yet. Choose "Prepare Inputs" to assemble inputs, or "Calculate payroll" to run gross-to-net.</p>`}`;

  $('#period').onchange = () => payrollView($('#period').value);
  $('#prepInputs') && ($('#prepInputs').onclick = async () => {
    try {
      const res = await api(`/api/payroll/${$('#period').value}/prepare-inputs`, { method: 'POST' });
      say(`Prepared inputs for ${res.inputsCount} employees. State: ${res.status}.`);
      payrollView($('#period').value);
    } catch (e) { say(esc(e.message), 'err'); }
  });
  $('#calc') && ($('#calc').onclick = async () => { try { await api(`/api/payroll/${$('#period').value}/calculate`, { method: 'POST' }); say('Payroll calculated.'); payrollView($('#period').value); } catch (e) { say(esc(e.message), 'err'); } });
  $('#appr') && ($('#appr').onclick = async () => {
    if (!confirm('Approve and lock this period? Loan balances will be updated and it cannot be edited afterwards.')) return;
    try { await api(`/api/payroll/${period}/approve`, { method: 'POST' }); say('Payroll approved and locked.'); payrollView(period); }
    catch (e) {
      const detail = e.data?.exceptions ? '<br>' + e.data.exceptions.map((x) => `${esc(x.empId || '')}: ${x.message || (Array.isArray(x.flags) ? x.flags.join(', ') : '')}`).join('<br>') : '';
      say(esc(e.message) + detail, 'err');
    }
  });
  $('#applyFilters') && ($('#applyFilters').onclick = () => payrollView($('#period').value));
  $('#resetFilters') && ($('#resetFilters').onclick = () => {
    if ($('#regDeptFilter')) $('#regDeptFilter').value = '';
    if ($('#regSearch')) $('#regSearch').value = '';
    if ($('#regSortBy')) $('#regSortBy').value = 'empId';
    if ($('#regSortDir')) $('#regSortDir').value = 'asc';
    payrollView($('#period').value);
  });
  const dlReg = async (url, fn) => {
    try {
      const r = await api(url, { raw: true });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(await r.blob());
      a.download = fn;
      a.click();
    } catch (e) { say(esc(e.message), 'err'); }
  };
  $('#dlRegCsv') && ($('#dlRegCsv').onclick = () => dlReg(`/api/payroll/${period}/register.csv`, `payroll-register-${period}.csv`));
  $('#dlRegXlsx') && ($('#dlRegXlsx').onclick = () => dlReg(`/api/payroll/${period}/register.xlsx`, `payroll-register-${period}.xlsx`));
  $('#dlRegPdf') && ($('#dlRegPdf').onclick = () => dlReg(`/api/payroll/${period}/register.pdf`, `payroll-register-${period}.pdf`));
  $('#bank') && ($('#bank').onclick = async () => {
    try { const r = await api(`/api/payroll/${period}/bank.csv`, { raw: true }); const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = `bank-${period}.csv`; a.click(); } catch (e) { say(esc(e.message), 'err'); }
  });
  $('#postGL') && ($('#postGL').onclick = async () => {
    try { const r = await api(`/api/payroll/${period}/post-gl`, { method: 'POST' }); say(r.message); payrollView(period); }
    catch (e) { say(esc(e.message), 'err'); }
  });
  $('#initiateBank') && ($('#initiateBank').onclick = async () => {
    try { const r = await api(`/api/payroll/${period}/initiate-bank-payment`, { method: 'POST', body: { channel: 'NIBSS_INSTANT_PAY' } }); say(r.message); payrollView(period); }
    catch (e) { say(esc(e.message), 'err'); }
  });
  $('#view').onclick = async (e) => {
    const id = e.target.dataset.slip; if (!id) return;
    const p = await api(`/api/payroll/${period}/payslip/${id}`);
    const row = (l, v, b) => `<tr><td>${b ? '<b>' + l + '</b>' : l}</td><td>${b ? '<b>' + money(v) + '</b>' : money(v)}</td></tr>`;
    $('#slip').innerHTML = `<h3 style="margin-top:0">Payslip, ${p.period}</h3><p>${esc(p.name)} (${esc(p.empId)})<br>${esc(p.department || '')} ${esc(p.position || '')}${p.status !== 'Approved' ? '<br><b class="flag">Draft, not approved</b>' : ''}</p>
    <table>${row('Basic', p.basic)}${row('Allowances', p.allowances)}${row(`Overtime (${p.otHours} h)`, p.otPay)}${row('Bonuses', p.bonuses)}${row('Gross pay', p.gross, 1)}${row('Pension', p.pension)}${row('NHF', p.nhf)}${row('PAYE', p.paye)}${row('Loan deduction', p.loanDeduction)}${row('Other deductions', p.otherDeductions)}${row('Net pay', p.netPay, 1)}</table>
    <p class="noprint" style="display:flex;gap:.5rem"><button onclick="window.print()">Print</button><button onclick="document.querySelector('#slip').close()">Close</button></p>`;
    $('#slip').showModal();
  };
}

// ---- sign in ----
async function start() {
  try { me = await api('/api/me'); } catch (e) { sessionStorage.clear(); return; }
  if (me.mustChangePassword) {
    tab = 'Account';
  } else if (me.role === 'employee') {
    tab = 'Self-Service';
  }
  $('#login').style.display = 'none'; $('#app').style.display = 'grid'; show();
}
$('#loginForm').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await api('/api/auth/login', { method: 'POST', body: { username: $('#user').value, password: $('#key').value } });
    sessionStorage.setItem('token', r.token); $('#loginErr').textContent = ''; start();
  } catch (err) { $('#loginErr').textContent = err.message; }
};
if (sessionStorage.getItem('token')) start();
</script>
